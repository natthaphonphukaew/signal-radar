name: Collect signals

on:
  schedule:
    # Every 6 hours (UTC). GitHub may delay scheduled runs under load.
    - cron: '0 */6 * * *'
  workflow_dispatch: # manual "Run workflow" button

# Required so the job can commit the regenerated data file back to the repo.
permissions:
  contents: write

concurrency:
  group: collect-signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run pipeline

      - name: Commit updated signals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/signals.json
          # Only commit when the data actually changed — avoids empty commits.
          if git diff --staged --quiet; then
            echo "No change in signals.json — nothing to commit."
          else
            git commit -m "chore(data): refresh signals [skip ci]"
            git push
          fi
